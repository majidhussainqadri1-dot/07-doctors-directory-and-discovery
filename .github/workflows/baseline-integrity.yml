name: File 07 Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print critical source hashes
        run: sha256sum doctors-directory/includes/class-sdd-seo.php doctors-directory/uninstall.php

      - name: Verify repository SHA-256 checksums
        run: sha256sum -c CHECKSUMS.sha256

      - name: Check PHP syntax
        run: find doctors-directory -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: find doctors-directory -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run File 07 static audit
        run: bash tests/static-audit.sh

      - name: Verify WCAG contrast pairs
        run: python3 tests/test-contrast.py
