name: File 07 Second Fresh Review Checksum Diagnostic
on:
  push:
    branches:
      - fix/file-07-second-fresh-80-review-20260810
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate final source checksum manifest
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          exclude={
            'CHECKSUMS.sha256',
            '.github/workflows/second-fresh-review-checksum-diagnostic.yml',
          }
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          print('BEGIN_FINAL_CHECKSUMS')
          for p in sorted(x for x in paths if x and x not in exclude):
              with open(p,'rb') as f:
                  digest=hashlib.sha256(f.read()).hexdigest()
              print(f'{digest}  ./{p}')
          print('END_FINAL_CHECKSUMS')
          PY
      - name: Build corrected deterministic package
        run: |
          bash tests/build-release.sh
          echo BEGIN_PACKAGE_SHA
          sha256sum build/07-doctors-directory-and-discovery-1.2.0.zip
          echo END_PACKAGE_SHA
