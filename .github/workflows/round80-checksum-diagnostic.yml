name: File 07 Round80 Checksum Diagnostic
on:
  push:
    branches:
      - fix/file-07-second-fresh-round80-package-gate
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate source checksum manifest
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          exclude={'CHECKSUMS.sha256','.github/workflows/round80-checksum-diagnostic.yml'}
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          print('BEGIN_FINAL_CHECKSUMS')
          for p in sorted(x for x in paths if x and x not in exclude):
              with open(p,'rb') as f: digest=hashlib.sha256(f.read()).hexdigest()
              print(f'{digest}  ./{p}')
          print('END_FINAL_CHECKSUMS')
          PY
      - name: Confirm installable package identity
        run: |
          bash tests/build-release.sh
          sha256sum build/07-doctors-directory-and-discovery-1.2.0.zip
